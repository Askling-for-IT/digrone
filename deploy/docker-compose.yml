name: digrone

services:
  digrone-backend:
    image: ${BACKEND_IMAGE:?Run deploy.sh with a published commit SHA}
    restart: unless-stopped
    environment:
      PORT: "8080"
      VERSION: ${APP_VERSION}
      DATABASE_URL: ${DATABASE_URL:?Set the digrone production database URL}
      APP_URL: ${APP_PUBLIC_URL}
      OIDC_ISSUER: ${KEYCLOAK_PUBLIC_URL}/realms/${KEYCLOAK_REALM}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set the digrone client secret}
      OIDC_REDIRECT_URL: ${APP_PUBLIC_URL}/auth/callback
      OIDC_ADMIN_ROLE: admin
    networks:
      - shared

  digrone-frontend:
    image: ${FRONTEND_IMAGE:?Run deploy.sh with a published commit SHA}
    restart: unless-stopped
    depends_on:
      - digrone-backend
    networks:
      - shared

networks:
  shared:
    external: true
    name: ${SHARED_NETWORK:?Set the existing shared Docker network name}
