services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: digrone
      POSTGRES_USER: digrone
      POSTGRES_PASSWORD: digrone
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digrone -d digrone"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
